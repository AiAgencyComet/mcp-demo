<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fernhill order board</title>
<style>
  /* Fallbacks first. The host can override any of these through hostContext.styles.variables. */
  :root {
    --color-background-primary: #fffdf9;
    --color-background-secondary: #f6f0e7;
    --color-text-primary: #2b1f17;
    --color-text-secondary: #7a6a5d;
    --color-border-primary: #e9dfd2;
    --font-sans: ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, monospace;
    --border-radius-md: 10px;
    --fh-brown: #4a3326;
    --fh-making: #b26b12;   --fh-making-bg: #fdf1df;
    --fh-ready: #1f7a55;    --fh-ready-bg: #e3f4ec;
    --fh-done: #8c8178;     --fh-done-bg: #f1ece6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--color-background-primary); color: var(--color-text-primary);
               font-family: var(--font-sans); font-size: 15px; -webkit-font-smoothing: antialiased; }
  .board { padding: 14px 18px 12px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .mark { width: 34px; height: 34px; border-radius: 9px; background: var(--fh-brown); display: grid; place-items: center; }
  .title { font-weight: 650; font-size: 17px; letter-spacing: -0.01em; }
  .sub { color: var(--color-text-secondary); font-size: 13px; margin-top: 1px; }
  .counts { margin-left: auto; display: flex; gap: 8px; }
  .count { font-size: 13px; padding: 5px 10px; border-radius: 999px; background: var(--color-background-secondary);
           color: var(--color-text-secondary); font-variant-numeric: tabular-nums; }
  .count b { color: var(--color-text-primary); font-weight: 650; }
  ul { list-style: none; margin: 0; padding: 0; border: 1px solid var(--color-border-primary);
       border-radius: var(--border-radius-md); overflow: hidden; }
  li { display: grid; grid-template-columns: 74px 1fr auto 92px 108px; align-items: center; gap: 12px;
       padding: 7px 14px; border-top: 1px solid var(--color-border-primary); transition: background .5s; }
  li:first-child { border-top: 0; }
  li.flash { background: #eaf7f0; }
  .id { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); }
  .line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who { font-weight: 600; }
  .items { color: var(--color-text-secondary); font-size: 13px; }
  .total { font-variant-numeric: tabular-nums; font-size: 14px; text-align: right; }
  .pill { justify-self: start; font-size: 12px; font-weight: 600; padding: 4px 9px; border-radius: 999px; }
  .pill.making { color: var(--fh-making); background: var(--fh-making-bg); }
  .pill.ready  { color: var(--fh-ready);  background: var(--fh-ready-bg); }
  .pill.done   { color: var(--fh-done);   background: var(--fh-done-bg); }
  li.is-done .who, li.is-done .items, li.is-done .total { color: var(--fh-done); }
  button { font: inherit; font-size: 13px; font-weight: 600; border-radius: 8px; padding: 5px 0; width: 100%;
           border: 1px solid var(--fh-brown); background: var(--fh-brown); color: #fff; cursor: pointer; }
  button:hover { filter: brightness(1.12); }
  button:disabled { cursor: default; filter: none; }
  button.saving { background: #fff; color: var(--fh-brown); }
  .check { justify-self: stretch; text-align: center; color: var(--fh-done); font-size: 13px; }
  .skel { height: 12px; border-radius: 6px; background: linear-gradient(90deg, #f1ebe3 0%, #f8f3ec 50%, #f1ebe3 100%);
          background-size: 200% 100%; animation: shimmer 1.2s infinite linear; }
  @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  footer { display: flex; justify-content: space-between; margin-top: 10px; font-size: 12px; color: var(--color-text-secondary); }
  footer code { font-family: var(--font-mono); font-size: 11.5px; }
  .toast { position: fixed; left: 50%; bottom: 14px; transform: translate(-50%, 20px); opacity: 0;
           background: var(--color-text-primary); color: #fff; font-size: 13px; padding: 8px 14px; border-radius: 8px;
           transition: all .25s; pointer-events: none; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.warn { background: #9b2c2c; }
</style>
</head>
<body>
<div class="board">
  <header>
    <div class="mark" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><ellipse cx="12" cy="12" rx="7" ry="9.5" transform="rotate(35 12 12)" fill="#f3e3cf"/><path d="M8.2 18.4c3.4-2.6 4.6-8.4 7.6-12.8" stroke="#4a3326" stroke-width="1.7" stroke-linecap="round"/></svg>
    </div>
    <div>
      <div class="title">Fernhill Coffee · Order board</div>
      <div class="sub" id="sub">Waiting for the host…</div>
    </div>
    <div class="counts">
      <span class="count"><b id="n-open">–</b> open</span>
      <span class="count"><b id="n-done">–</b> done</span>
    </div>
  </header>
  <ul id="list"></ul>
  <footer>
    <span>Data: <code>show_order_board</code></span>
    <span>Button: <code>tools/call mark_order_done</code> through the host</span>
  </footer>
</div>
<div class="toast" id="toast"></div>

<script>
// The View talks to the host with JSON-RPC 2.0 over postMessage. No SDK, no network access.
const PROTOCOL = "2026-01-26";
let nextId = 1;
const pending = new Map();
let orders = [];
let rowOrder = [];   // fixed when the result arrives, so a row does not jump when its status changes

function send(msg) { window.parent.postMessage(msg, "*"); }
function request(method, params) {
  const id = nextId++;
  send({ jsonrpc: "2.0", id, method, params });
  return new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
}
function notify(method, params) { send({ jsonrpc: "2.0", method, params }); }

window.addEventListener("message", (event) => {
  if (event.source !== window.parent) return;
  const m = event.data;
  if (!m || m.jsonrpc !== "2.0") return;
  if (m.id !== undefined && m.method === undefined) {            // a response to one of our requests
    const p = pending.get(m.id);
    if (p) { pending.delete(m.id); m.error ? p.reject(m.error) : p.resolve(m.result); }
    return;
  }
  switch (m.method) {
    case "ui/notifications/tool-input":   showLoading(m.params.arguments); break;
    case "ui/notifications/tool-result":  showResult(m.params); break;
    case "ui/notifications/tool-cancelled": setSub("The tool call was cancelled: " + m.params.reason); break;
    case "ui/notifications/host-context-changed": applyHostContext(m.params); break;
    case "ui/resource-teardown": send({ jsonrpc: "2.0", id: m.id, result: {} }); break;
    case "ping": send({ jsonrpc: "2.0", id: m.id, result: {} }); break;
  }
});

function applyHostContext(ctx) {
  const vars = ctx && ctx.styles && ctx.styles.variables;
  if (vars) for (const [k, v] of Object.entries(vars)) if (v) document.documentElement.style.setProperty(k, v);
  if (ctx && ctx.theme) document.documentElement.dataset.theme = ctx.theme;
}
function setSub(text) { document.getElementById("sub").textContent = text; }

function showLoading(args) {
  setSub("Loading orders…");
  const list = document.getElementById("list");
  list.innerHTML = "";
  for (let i = 0; i < 5; i++) {
    const li = document.createElement("li");
    li.innerHTML = '<div class="skel" style="width:52px"></div><div><div class="skel" style="width:' + (160 + i * 31) + 'px"></div></div><div class="skel" style="width:56px"></div>' +
      '<div class="skel" style="width:44px;justify-self:end"></div><div class="skel" style="height:26px"></div>';
    list.appendChild(li);
  }
}

function showResult(result) {
  const data = result.structuredContent || {};
  orders = data.orders || [];
  rowOrder = [...orders].sort((a, b) => RANK[a.status] - RANK[b.status] || a.order_id.localeCompare(b.order_id)).map(o => o.order_id);
  setSub(data.day ? data.day + " · " + orders.length + " orders" : orders.length + " orders");
  render();
}

const RANK = { ready: 0, making: 1, done: 2 };
function render(flashId) {
  const list = document.getElementById("list");
  list.innerHTML = "";
  const sorted = rowOrder.map(id => orders.find(o => o.order_id === id)).filter(Boolean);
  for (const o of sorted) {
    const li = document.createElement("li");
    li.dataset.id = o.order_id;
    if (o.status === "done") li.classList.add("is-done");
    if (o.order_id === flashId) li.classList.add("flash");
    li.innerHTML =
      '<span class="id">' + o.order_id + '</span>' +
      '<div class="line"><span class="who">' + esc(o.name) + '</span><span class="items"> · ' + esc(o.items.join(" · ")) + ' · ' + o.placed + '</span></div>' +
      '<span class="pill ' + o.status + '">' + label(o.status) + '</span>' +
      '<span class="total">$' + o.total.toFixed(2) + '</span>' +
      (o.status === "done" ? '<span class="check">✓ Done</span>'
                           : '<button data-done="' + o.order_id + '">Mark done</button>');
    list.appendChild(li);
  }
  document.getElementById("n-open").textContent = orders.filter(o => o.status !== "done").length;
  document.getElementById("n-done").textContent = orders.filter(o => o.status === "done").length;
  if (flashId) setTimeout(() => { const el = list.querySelector('[data-id="' + flashId + '"]'); el && el.classList.remove("flash"); }, 1600);
}
function label(s) { return s === "making" ? "Making" : s === "ready" ? "Ready" : "Done"; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

let toastTimer;
function toast(text, warn) {
  const t = document.getElementById("toast");
  t.textContent = text; t.className = "toast show" + (warn ? " warn" : "");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.className = "toast", 2600);
}

document.getElementById("list").addEventListener("click", async (event) => {
  const btn = event.target.closest("button[data-done]");
  if (!btn) return;
  const id = btn.dataset.done;
  btn.disabled = true; btn.classList.add("saving"); btn.textContent = "Saving…";
  try {
    // The button does not change the page by itself. It asks the host to run a server tool.
    const result = await request("tools/call", { name: "mark_order_done", arguments: { order_id: id } });
    if (result.isError) throw { message: result.content && result.content[0] ? result.content[0].text : "Tool error" };
    const updated = result.structuredContent.order;
    orders = orders.map(o => o.order_id === updated.order_id ? updated : o);
    render(updated.order_id);
    toast(updated.order_id + " marked done · saved on the server");
    const open = orders.filter(o => o.status !== "done").length;
    // Tell the model what the person did, for the next turn.
    await request("ui/update-model-context", {
      content: [{ type: "text", text: "The person marked order " + updated.order_id + " (" + updated.name +
                  ") done on the order board. Open orders now: " + open + "." }],
    });
  } catch (err) {
    btn.disabled = false; btn.classList.remove("saving"); btn.textContent = "Mark done";
    toast("Not done: " + (err && err.message ? err.message : String(err)), true);
  }
});

(async () => {
  const init = await request("ui/initialize", {
    appInfo: { name: "fernhill-order-board", version: "1.0.0" },
    appCapabilities: { availableDisplayModes: ["inline"] },
    protocolVersion: PROTOCOL,
  });
  applyHostContext(init.hostContext);
  setSub("Connected to " + init.hostInfo.name);
  notify("ui/notifications/initialized", {});
  // Report the content size so the host can fit the frame to it (flexible height).
  let last = "";
  new ResizeObserver(() => {
    const el = document.querySelector(".board");
    const size = { width: Math.ceil(el.scrollWidth), height: Math.ceil(el.scrollHeight) };
    if (JSON.stringify(size) === last) return;
    last = JSON.stringify(size);
    notify("ui/notifications/size-changed", size);
  }).observe(document.querySelector(".board"));
})();
</script>
</body>
</html>
